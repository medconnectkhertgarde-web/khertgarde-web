<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f6" />
    <script>
      try {
        const savedTheme = localStorage.getItem("khert-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", savedTheme ? savedTheme === "dark" : prefersDark);
      } catch {}
    </script>
    <meta name="author" content="Khert Laguna Garde" />
    <meta
      name="description"
      content="Portfolio of Khert Laguna Garde, an independent researcher focused on medicine and clinical studies."
    />
    <meta property="og:title" content="Khert Laguna Garde — Independent Researcher" />
    <meta
      property="og:description"
      content="Portfolio of Khert Laguna Garde, an independent researcher focused on medicine and clinical studies."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Khert Laguna Garde — Independent Researcher</title>
  </head>
